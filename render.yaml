services:
  - type: web
    name: safeher-women-safety
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: safeher-db
          property: connectionString

databases:
  - name: safeher-db
    databaseName: safeher
    plan: free